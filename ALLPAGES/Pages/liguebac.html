<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../Css/project.css">
    <link rel="stylesheet" href="../Css/liguebac.css">
    <title>Ligue bac - Scola</title>
</head>
<body>

    <header class="header-accueil">
        <div class="containerLogo">
            <a href="../index.html" style="text-decoration:none;">
                <p class="name">Scola</p>
            </a>
        </div>
    </header>

    <main class="ligue-wrap">

        <!-- ==================================================== -->
        <!-- EN-TÊTE DE LA SEMAINE                                -->
        <!-- chapitreSemaine et joursRestants sont remplis par    -->
        <!-- JS depuis GET /api/league/current-week               -->
        <!-- ==================================================== -->
        <section class="ligue-header">
            <p class="ligue-kicker">Championnat de la semaine</p>
            <h1 class="ligue-chapitre" id="chapitreSemaine">Chargement du chapitre...</h1>
            <p class="ligue-compte-a-rebours" id="joursRestants">--</p>
        </section>

        <!-- ==================================================== -->
        <!-- PODIUM TOP 3                                         -->
        <!-- ==================================================== -->
        <section class="podium" id="podium">
            <!-- Rempli dynamiquement : 3 cartes (2e, 1er, 3e dans cet ordre visuel) -->
        </section>

        <!-- ==================================================== -->
        <!-- CLASSEMENT — UNIQUEMENT LES PARTICIPANTS             -->
        <!-- ==================================================== -->
        <section class="classement">
            <div class="classement-titre-ligne">
                <h2>Classement</h2>
                <span class="classement-sous-titre">Seuls les élèves ayant joué cette semaine apparaissent ici</span>
            </div>
            <ul class="liste-classement" id="listeClassement">
                <!-- Rempli dynamiquement -->
            </ul>
            <p class="classement-vide" id="classementVide" style="display:none;">
                Personne n'a encore marqué de points cette semaine. Sois le premier à jouer !
            </p>
        </section>

        <!-- ==================================================== -->
        <!-- LAURÉAT DU MOIS                                      -->
        <!-- ==================================================== -->
        <section class="laureat-mois" id="laureatMois">
            <div class="laureat-icone"><i class="fa-solid fa-crown"></i></div>
            <div class="laureat-texte">
                <p class="laureat-label">Lauréat du mois</p>
                <p class="laureat-nom" id="laureatNom">--</p>
                <p class="laureat-detail" id="laureatDetail">--</p>
            </div>
        </section>

        <div class="ligue-cta">
            <a href="jouer.html" class="ligue-bouton-jouer">
                <i class="fa-solid fa-play"></i> Jouer maintenant
            </a>
        </div>

    </main>

    <script src="../Javascript/project.js"></script>
    <script src="../Javascript/liguebac.js"></script>
</body>
</html>
