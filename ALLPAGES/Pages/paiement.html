<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Paiement — Scola</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f172a;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #f8fafc;
            background-image: url('../Images/scola-wave-background.svg');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* ── LOGO ── */
        .logo-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .logo-bar span {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
        }
        .logo-bar .dot { color: #3b82f6; }

        /* ── CARTE PRINCIPALE ── */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 36px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
        }

        /* ── ÉTAPES ── */
        .etapes {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 32px;
        }
        .etape {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .etape-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #334155;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .etape-num.active {
            background: #3b82f6;
            color: #fff;
        }
        .etape-num.done {
            background: #16a34a;
            color: #fff;
        }
        .etape-label {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }
        .etape-label.active { color: #3b82f6; }
        .etape-label.done { color: #16a34a; }
        .etape-ligne {
            width: 50px;
            height: 2px;
            background: #334155;
            margin-bottom: 18px;
            transition: background 0.3s;
        }
        .etape-ligne.done { background: #16a34a; }

        /* ── RÉSUMÉ COMMANDE ── */
        .resumé {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .resumé-gauche { display: flex; flex-direction: column; gap: 4px; }
        .resumé-plan {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
        }
        .resumé-plan span { color: #3b82f6; }
        .resumé-duree { font-size: 13px; color: #64748b; }
        .resumé-prix {
            font-size: 22px;
            font-weight: 800;
            color: #3b82f6;
        }
        .resumé-prix small {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
        }

        /* ── ÉCRANS ── */
        .ecran { display: none; }
        .ecran.visible { display: block; }

        /* ── FORMULAIRE ── */
        .form-titre {
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 6px;
        }
        .form-sous-titre {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .field { margin-bottom: 16px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .field-input-wrap {
            position: relative;
        }
        .field-input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
        }
        .field input {
            width: 100%;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 10px;
            padding: 13px 14px 13px 42px;
            font-size: 15px;
            color: #f8fafc;
            outline: none;
            transition: border-color 0.2s;
            letter-spacing: 1px;
        }
        .field input:focus {
            border-color: #3b82f6;
        }
        .field input::placeholder { color: #475569; letter-spacing: 0; }

        /* ── PIN DOTS ── */
        .pin-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 16px 0 20px;
        }
        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #334155;
            background: transparent;
            transition: all 0.2s;
        }
        .pin-dot.filled {
            background: #3b82f6;
            border-color: #3b82f6;
        }

        .pin-clavier {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .pin-btn {
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 10px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .pin-btn:hover { background: #1e293b; border-color: #3b82f6; }
        .pin-btn:active { transform: scale(0.95); }
        .pin-btn.effacer {
            font-size: 13px;
            color: #64748b;
        }
        .pin-btn.vide { visibility: hidden; }

        /* ── BOUTON PRINCIPAL ── */
        .btn-payer {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-payer:hover { background: #2563eb; }
        .btn-payer:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-payer.loading {
            background: #1d4ed8;
            cursor: wait;
        }

        /* ── CHARGEMENT ── */
        .ecran-chargement {
            text-align: center;
            padding: 20px 0;
        }
        .spinner {
            width: 56px;
            height: 56px;
            border: 4px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .chargement-titre {
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        .chargement-texte {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
        }
        .chargement-etapes {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        .chargement-etape {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #64748b;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.4s;
        }
        .chargement-etape.visible {
            opacity: 1;
            transform: translateX(0);
        }
        .chargement-etape i { width: 18px; text-align: center; }
        .chargement-etape.ok { color: #16a34a; }
        .chargement-etape.ok i { color: #16a34a; }

        /* ── SUCCÈS ── */
        .ecran-succes { text-align: center; padding: 10px 0; }
        .succes-cercle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        .succes-titre {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        .succes-texte {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .succes-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .btn-dashboard {
            width: 100%;
            background: #3b82f6;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.2s;
        }
        .btn-dashboard:hover { background: #2563eb; }

        /* ── ERREUR ── */
        .msg-erreur {
            background: #450a0a;
            border: 1px solid #dc2626;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 14px;
            display: none;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .payment-method {
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .payment-method:hover {
            border-color: #3b82f6;
            background: #1e293b;
        }
        .payment-method-title {
            font-size: 15px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 6px;
        }
        .payment-method-number {
            font-size: 16px;
            font-weight: 800;
            color: #3b82f6;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }
        .payment-method-status {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
        }
        .upload-section {
            margin-bottom: 20px;
        }
        .upload-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .upload-box {
            background: #0f172a;
            border: 2px dashed #334155;
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #3b82f6;
            background: #1e293b;
        }
        .upload-box-icon {
            font-size: 28px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .upload-box-text {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }
        #screenshot-input {
            display: none;
        }
        .screenshot-preview {
            margin-top: 12px;
            text-align: center;
        }
        .screenshot-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .screenshot-name {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
        }
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: #475569;
            margin-top: 20px;
        }
        .securite i { color: #16a34a; }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .card { padding: 28px 20px; }
            .pin-btn { padding: 14px; font-size: 16px; }
        }

         body{
    background-image: url('../Images/scola-wave-background.svg');
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
}
    </style>
</head>
<body>
    <div class="logo-bar">
        <span>Scola<span class="dot">.</span></span>
    </div>

    <div class="card">
        <div class="title-box">
            <h1>Paiement</h1>
            <p>Transfère l’argent puis envoie la preuve</p>
        </div>

        <div class="payment-methods">
            <div class="payment-method">
                <div class="payment-method-label">NatCash</div>
                <div class="payment-method-number">55993344</div>
            </div>

            <div class="payment-method">
                <div class="payment-method-label">MonCash</div>
                <div class="payment-method-number">37373431</div>
            </div>
        </div>

        <div class="upload-section">
            <label class="upload-label">Screenshot de la transaction</label>
            <div class="upload-box" onclick="document.getElementById('screenshot-input').click()">
                <div class="upload-box-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
                <div class="upload-box-text">Clique ici pour ajouter la preuve<br>PNG, JPG ou PDF</div>
            </div>
            <input type="file" id="screenshot-input" accept="image/png,image/jpeg,.pdf" onchange="handleFileUpload(event)">
            <div class="screenshot-preview" id="screenshot-preview"></div>
        </div>

        <div class="msg-erreur" id="err-paiement">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="err-paiement-txt">Choisis un screenshot pour confirmer</span>
        </div>

        <button class="btn-payer" id="btn-confirmer" onclick="confirmerPaiement()">
            <i class="fa-solid fa-check"></i>
            Confirmer
        </button>

        <div class="success-box" id="success-box">
            <i class="fa-solid fa-circle-check"></i>
            Paiement envoyé. En attente de confirmation.
        </div>
    </div>

    <script>
        let screenshotFile = null;
        let screenshotData = null;
        const params = new URLSearchParams(window.location.search);
        const tier = params.get('tier') === 'ia' ? 'ia' : 'pro';
        const montant = tier === 'ia' ? 500 : 250;

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const allowed = ['image/png', 'image/jpeg', 'application/pdf'];
            if (!allowed.includes(file.type)) {
                document.getElementById('err-paiement').style.display = 'block';
                document.getElementById('err-paiement-txt').textContent = 'Format non supporté. Choisis PNG, JPG ou PDF';
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                document.getElementById('err-paiement').style.display = 'block';
                document.getElementById('err-paiement-txt').textContent = 'Le fichier est trop grand. Max 5MB';
                return;
            }

            screenshotFile = file;
            document.getElementById('err-paiement').style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(e) {
                screenshotData = e.target.result;
                const preview = document.getElementById('screenshot-preview');
                if (file.type.startsWith('image')) {
                    preview.innerHTML = '<img src="' + e.target.result + '" alt="Preuve de paiement"><div class="screenshot-name">✓ ' + file.name + '</div>';
                } else {
                    preview.innerHTML = '<div class="file-icon">📄</div><div class="screenshot-name">✓ ' + file.name + '</div>';
                }
            };
            reader.readAsDataURL(file);
        }

        async function confirmerPaiement() {
            if (!screenshotFile) {
                document.getElementById('err-paiement').style.display = 'block';
                document.getElementById('err-paiement-txt').textContent = 'Télécharge d’abord le screenshot de la transaction';
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'connexion.html';
                return;
            }

            const button = document.getElementById('btn-confirmer');
            button.disabled = true;
            button.textContent = 'Envoi...';

            try {
                const response = await fetch('/api/paiement/demande-confirmation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        tier,
                        montant,
                        screenshot: {
                            data: screenshotData.split(',')[1],
                            type: screenshotFile.type,
                            name: screenshotFile.name
                        }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Erreur lors de l’envoi');

                document.getElementById('success-box').style.display = 'flex';
                button.textContent = 'Confirmé';
            } catch (error) {
                document.getElementById('err-paiement').style.display = 'block';
                document.getElementById('err-paiement-txt').textContent = error.message;
                button.disabled = false;
                button.textContent = 'Confirmer';
            }
        }
    </script>
</body>
</html>
